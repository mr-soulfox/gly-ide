name: Check

on:
  workflow_dispatch:
  push:

jobs:
  check:
    name: Test lint and formatter
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 20.14.0

      - name: Install dependencies
        run: npm install

      - name: Run typescript check
        run: npm run type-check

      - name: Run ESlint
        run: npm run lint

  build:
    name: Test Build
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 20.14.0

      - name: Install dependencies
        run: npm install

      - name: Create .env
        run: |
          echo 'VITE_WEB_RTC_URL="stun:stun.gmx.net"' > .env
          echo 'VITE_ENGINE_VERSION=' >> .env

      - name: Build
        run: npm run build
